name: Release to WordPress.org

on:
  release:
    types:
      - released

permissions:
  contents: write

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: wordpress.org
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve and verify the release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' seatlayer.php)"
          stable_tag="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v0.3.0." >&2
            exit 1
          fi

          if [[ "$plugin_version" != "$version" || "$stable_tag" != "$version" ]]; then
            echo "Tag $version, plugin version $plugin_version, and Stable tag $stable_tag must match." >&2
            exit 1
          fi

          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the released source
        run: |
          php -l seatlayer.php
          php -l uninstall.php
          for file in includes/*.php; do php -l "$file"; done
          node --check assets/js/frontend.js
          node --check assets/js/block.js
          php tests/settings-logic.php
          node tests/frontend-options.js

      - name: Deploy the tag to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: seatlayer-seating-charts
          VERSION: ${{ steps.version.outputs.number }}

      - name: Attach the installable ZIP to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
